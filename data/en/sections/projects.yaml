- name: Utilizing news sentiment to predict the future daily price of the Vanguard Information Technology ETF
  logo: #/images/sections/projects/no-code.png
  role: Contributor
  timeline: "Jan 2026"
  repo: https://github.com/ApollocreedXI/Utilizing-news-sentiment-to-predict-future-price-of-the-Vanguard-ETF/tree/main
  #url: ""
  summary:  This project investigated the extent to which sentiment analysis of news articles alongside univariate price improves the predictive performance of network modeling on the Vanguard Technology ETF. It also investigated whether such models have meaningful improvements over a baseline ARIMA model. The project results supported that network models which incorporate news sentiment and univariate price show performance improvement over a univariate LSTM model. However, adding news sentiment alongside univariate price in neural networks was not found to exceed the performance of the baseline ARIMA model. This finding likely due to the lack of sufficient training data to train the neural networks, rather than the ARIMA model being more powerful.
  tags: ["Deep Learning", "LSTM Networks", 'Transformer', 'GRU Networks', "ARIMA", "Data Augmentation", "Fin-BERT"]

- name: Database Design for Climate-Resilient Water Management Systems in Tanzania
  logo: #/images/sections/projects/no-code.png
  role: Contributor
  timeline: "Aug 2026"
  url: "https://climate-resilient-database.streamlit.app/"
  summary: This graduate capstone project purpose was to support Tanazia's new water policy, which among other things, was to develop a national water grid. In developing this new infrastructure, policymakers will find it beneficial to evaluate communities that are most vulnerable to the impact of climate change (e.g., more susceptible to droughts and floods) and prioritize investment there. However, investment prioritization is a challenge as Tanzania’s water management system employs a decentralized structure, creating disparate information regarding administrative water management constructs. In collaboration with a colleage, this capstone project creates a database to unify this disparate information of the water management constructs. Furthermore, using the created database, low-water resilient regions are identified and visualized to assist prioritized grid investment. 
  tags: ["Data Engineering", "Machine Learning", "K-means clustering", "Streamlit", "Dashboard", "PostGis", "Rioxarray", "Rasterio", "GeoPandas", "Dask", "SQLAlchemy", "Collaboration"]

