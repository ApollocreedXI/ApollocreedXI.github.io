- name: Resilience Testing a Fine-Tuned AI Detector Against Tiered Prompt Attacks
  role: Contributor
  timeline: "Aug 2026"
  url: "https://1drv.ms/b/c/29eb65febd53f90e/IQDZlV-45YFDSoHdtaiRStvrAc4IQ_Emp6wg3zsq9K48v5w?e=4HxiAk"
  summary: A research paper that investigates the resilience of a current state-of-the-art (SOTA) AI-generated content detector (AIGC) against increasingly complex prompt attacks. The research found that the SOTA AIGC detector is fairly robust to adversarial prompt attacks, but remains vulnerable to paraphrased student essays with essay development constraints included in the input prompt. The research demonstrated that including these adversarial prompting strategies back into the training dataset recovered all performance loss exhibited in the baseline AIGC detector trained on simple prompting strategies. 
  tags: ["Deep Learning", "PyTorch", "BERT", "Transformers"]

