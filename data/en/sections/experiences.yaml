    overview: HCA is a national hospital organization in the United States and abroad. In NH, the organization has four main hospital which operated as a market during my time as an accountant. 
  positions:
  - designation: Accountant
    start: Aug 2023
    end: Apr 2025
    responsibilities:
    - Posted and reconciled high-dollar impact journal entries for the New Hampshire market, including prepaid amortization, intercompany transactions, and corporate transfer entries.
    - Recorded and managed high-value accounting entries for physician accounts payable and medical office building lockbox revenue and accounts receivable activity.
    - Developed an Excel Power Query to automate the data preprocessing of our corporate intercompany postings across the market, improving journal entry posting productivity during month-end.
    - Worked on annual financial and regulatory reporting, including tax filings and hospital cost reports.
    - Managed contract-based physician agreements, reviewing contract terms and preparing payment packets to ensure compliance with contractual obligations..
    - Conducted inventory audits during the New Hampshire market (i.e., three hospitals) annual inventory, ensuring accurate tracking of hospital assets.


